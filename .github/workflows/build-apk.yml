name: Build HD FLOW HRV NEU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack new Android project
        run: |
          rm -rf HD_FLOW_HRV_NEU
          mkdir -p HD_FLOW_HRV_NEU
          unzip -o HD_FLOW_HRV_NEU.zip -d HD_FLOW_HRV_NEU

      - name: Build debug APK
        working-directory: HD_FLOW_HRV_NEU
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-FLOW-HRV-NEU-APK
          path: HD_FLOW_HRV_NEU/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
